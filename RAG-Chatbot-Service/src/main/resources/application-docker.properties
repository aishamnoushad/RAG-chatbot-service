# Application Configuration
spring.application.name=RAG-Chatbot-Service
app.version=1.0.0

# Database Configuration
# These will use environment variables if set, otherwise use defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rag-chat-db}
spring.datasource.username=${DB_USERNAME:raguser}
spring.datasource.password=${DB_PASSWORD:rag@123}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Configuration
app.api.key=${API_KEY:your-secure-api-key-here}

# Rate Limiting Configuration
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

# Server Configuration
server.port=${SERVER_PORT:8087}

# Logging Configuration
logging.level.org.cloudjune.ragchatbotservice=${LOG_LEVEL:INFO}

#flyaway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Allow disabling Flyway via env for troubleshooting
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Ensure Flyway uses the same datasource credentials explicitly
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/rag-chat-db}
spring.flyway.user=${DB_USERNAME:raguser}
spring.flyway.password=${DB_PASSWORD:rag@123}

# Disable Spring Boot Docker Compose integration by default (can be overridden by env)
spring.docker.compose.enabled=${ENABLE_DOCKER_COMPOSE:false}

#springdoc.api-docs.path=/openapi

# Actuator exposure for troubleshooting
default.management.endpoints=health,env,info
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:${default.management.endpoints}}
management.endpoint.health.show-details=when_authorized
management.endpoint.env.show-values=ALWAYS
# Be careful not to log secrets; actuator will still sanitize known keys
management.endpoint.env.keys-to-sanitize=password,secret,apikey,api-key,authorization,db_password,spring.flyway.password

