# Application Configuration
spring.application.name=RAG-Chatbot-Service
app.version=1.0.0

# Database Configuration
# These will use environment variables if set, otherwise use defaults
spring.datasource.url=jdbc:postgresql://localhost:5432/rag-chat-db
spring.datasource.username=raguser
spring.datasource.password=rag@123

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Configuration
app.api.key=your-secure-api-key-here

# Rate Limiting Configuration
app.rate-limit.requests-per-minute=60

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.org.cloudjune.ragchatbotservice=INFO

#flyaway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Allow disabling Flyway via env for troubleshooting
spring.flyway.enabled=true
# Ensure Flyway uses the same datasource credentials explicitly
spring.flyway.url=jdbc:postgresql://localhost:5432/rag-chat-db
spring.flyway.user=raguser
spring.flyway.password=rag@123

# Disable Spring Boot Docker Compose integration by default (can be overridden by env)
spring.docker.compose.enabled=false

#springdoc.api-docs.path=/openapi

# Actuator exposure for troubleshooting
default.management.endpoints=health,env,info
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:${default.management.endpoints}}
management.endpoint.health.show-details=when_authorized
management.endpoint.env.show-values=ALWAYS
# Be careful not to log secrets; actuator will still sanitize known keys
management.endpoint.env.keys-to-sanitize=password,secret,apikey,api-key,authorization,db_password,spring.flyway.password

